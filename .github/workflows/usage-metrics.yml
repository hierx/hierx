name: Archive usage metrics

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out collector
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out metrics branch
        uses: actions/checkout@v4
        with:
          ref: usage-metrics
          path: metrics

      - name: Collect metrics
        env:
          GITHUB_REPOSITORY: hierx/hierx
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python source/scripts/collect_usage_metrics.py --output-dir metrics/usage-metrics

      - name: Commit updated data
        working-directory: metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage-metrics
          if git diff --cached --quiet; then
            echo "No metric changes"
          else
            git commit -m "Update usage metrics"
            git push origin HEAD:usage-metrics
          fi
